<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-means - grupiranje točaka</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <h1>K-means - grupiranje točaka</h1>

    <p>
        Kliknite na graf kako biste dodali točke,
        a zatim odaberite željeni broj grupa.
    </p>

    <label for="cluster_count">Broj grupa:</label>
    <input
        id="cluster_count"
        type="number"
        min="2"
        max="10"
        value="3"
    >

    <button id="delete" type="button">Obriši točke</button>

    <p id="status">Broj točaka: 0</p>

    <canvas id="graph" width="800" height="500"></canvas>
</body>
</html>
